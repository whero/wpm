# Minecraft 26.x servers run on Java 25 and the Paper 26.x API is published
# requiring a Java 25 classpath, so compileJava targets 25. Kotlin 2.2.20 does
# not yet emit a JVM 25 target and falls back to 24; both run fine on a Java 25
# JVM, so relax Gradle's strict Java/Kotlin target-equality check to a warning.
kotlin.jvm.target.validation.mode=warning
